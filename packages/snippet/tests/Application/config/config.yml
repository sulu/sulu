sulu_snippet: {}

framework:
    # symfony recipe default configuration:
    workflows: null
    messenger:
        transports:
            sync: 'sync://'
        routing:
    translator:
        default_path: '%kernel.project_dir%/translations'

twig:
    paths:
        - '%kernel.project_dir%/templates'

# One named workflow, opted into by the `review` template only: every other template publishes directly.
sulu_content:
    request_workflows:
        review:
            required_user_approvals: 1
