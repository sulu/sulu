version: '3'
services:
  database:
    image: mysql:8.4
    command: [ "--max_connections=10000" ]
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: 'sulu_test'
      MYSQL_ROOT_PASSWORD: 'ChangeMe'
      MYSQL_ROOT_HOST: '%'
    volumes:
      - sulu-mysql84-data:/var/lib/mysql

volumes:
  sulu-mysql84-data:
