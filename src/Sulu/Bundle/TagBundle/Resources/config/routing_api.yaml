sulu_tag.get_tag:
    path: /tags/{id}.{_format}
    controller: sulu_tag.get_action
    methods: GET
    format: json
    requirements:
        _format: json|csv

sulu_tag.get_tags:
    path: /tags.{_format}
    controller: sulu_tag.get_all_action
    methods: GET
    format: json
    requirements:
        _format: json|csv

sulu_tag.post_tag:
    path: /tags.{_format}
    controller: sulu_tag.create_action
    methods: POST
    format: json
    requirements:
        _format: json|csv

sulu_tag.put_tag:
    path: /tags/{id}.{_format}
    controller: sulu_tag.put_action
    methods: PUT
    format: json
    requirements:
        _format: json|csv

sulu_tag.delete_tag:
    path: /tags/{id}.{_format}
    controller: sulu_tag.delete_action
    methods: DELETE
    format: json
    requirements:
        _format: json|csv

sulu_tag.patch_tags:
    path: /tags.{_format}
    controller: sulu_tag.patch_action
    methods: PATCH
    format: json
    requirements:
        _format: json|csv

sulu_tag.post_tag_merge:
    path: /tags/merge.{_format}
    controller: sulu_tag.tag_controller::postMergeAction
    methods: POST
    format: json
    requirements:
        _format: json|csv
