framework:
    # symfony recipe default configuration:
    workflows: null
    messenger:
        transports:
            sync: 'sync://'
        routing:
    profiler: { enabled: true, collect: false }

twig:
    paths:
        - '%kernel.project_dir%/templates'

# Four named workflows, opted into by the `review`, `review-seo`, `publish-required` and `review-validated` templates:
# every other template publishes directly.
sulu_content:
    request_workflows:
        review:
            required_user_approvals: 1
        review_seo:
            required_user_approvals: 1
            pre_validators:
                seo_required:
                    fields: ['title', 'description']
        publish_required:
            pre_validators:
                publish_required: ~
        review_validated:
            required_user_approvals: 1
            validators:
                test_configured_result:
                    result: 'reject'
